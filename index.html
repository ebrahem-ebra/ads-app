<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مشاهدة الإعلان</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #2c2c2e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 85%;
            max-width: 350px;
        }
        button {
            background-color: #2ea6ff;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #a0a0a5;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎬 شاهد واربح</h2>
        <p>اضغط على الزر بالأسفل لمشاهدة إعلان قصير والحصول على مكافأتك بالدولار.</p>
        <button id="adBtn" onclick="showAd()" disabled>جاري الاتصال بالسيرفر...</button>
        <div id="status">يتم تحميل مشغل الإعلانات...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const btn = document.getElementById('adBtn');
        const status = document.getElementById('status');

        function loadSdk(url, isFallback) {
            const s = document.createElement('script');
            s.src = url;
            s.setAttribute('data-zone', '12230710');
            s.setAttribute('data-sdk', 'show_12230710');
            
            s.onload = () => {
                btn.disabled = false;
                btn.innerText = "تشغيل الإعلان الآن";
                status.innerText = "✅ الإعلان جاهز للعرض.";
            };
            
            s.onerror = () => {
                if (!isFallback) {
                    status.innerText = "جاري تجربة السيرفر البديل...";
                    loadSdk('https://whephiwums.com', true);
                } else {
                    status.innerText = "❌ الشبكة تحجب سيرفرات الإعلانات. يرجى إيقاف مانع الإعلانات (Private DNS) أو تغيير الـ VPN.";
                    btn.disabled = false;
                    btn.innerText = "إعادة المحاولة";
                }
            };
            document.head.appendChild(s);
        }

        loadSdk('https://libtl.com', false);

        function showAd() {
            if (typeof window.show_12230710 !== 'function') {
                location.reload();
                return;
            }

            btn.disabled = true;
            status.innerText = "جاري تشغيل الإعلان...";

            window.show_12230710().then(() => {
                status.innerText = "✅ تمت المشاهدة! جاري إضافة الرصيد...";
                tg.sendData(JSON.stringify({ status: "ad_watched" }));
                setTimeout(() => { tg.close(); }, 1000);
            }).catch((err) => {
                status.innerText = "❌ لم تكتمل المشاهدة أو لا يتوفر إعلان حالياً.";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
