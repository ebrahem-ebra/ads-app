<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مشاهدة الإعلان</title>
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #2c2c2e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 85%;
            max-width: 350px;
        }
        button {
            background-color: #2ea6ff;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #a0a0a5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎬 شاهد واربح</h2>
        <p>اضغط على الزر بالأسفل لمشاهدة إعلان قصير والحصول على مكافأتك بالدولار.</p>
        <button id="adBtn" onclick="showAd()">تشغيل الإعلان الآن</button>
        <div id="status">جاهز للعرض...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let AdController;
        try {
            AdController = window.Adsgram.init({ blockId: "58915", debug: true });
        } catch (e) {
            document.getElementById('status').innerText = "خطأ في تهيئة الإعلان: " + e.message;
        }

        function showAd() {
            const btn = document.getElementById('adBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "جاري تحميل الإعلان...";

            AdController.show().then((result) => {
                status.innerText = "✅ تمت المشاهدة! جاري إضافة الرصيد...";
                tg.sendData(JSON.stringify({ status: "ad_watched" }));
                setTimeout(() => { tg.close(); }, 1000);
            }).catch((result) => {
                status.innerText = "❌ لم تكتمل المشاهدة: " + (result.description || "");
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
