<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مشاهدة الإعلان</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='https://libtl.com/sdk.js' data-zone='12230710' data-sdk='show_12230710'></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #2c2c2e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 85%;
            max-width: 350px;
        }
        button {
            background-color: #2ea6ff;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #a0a0a5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎬 شاهد واربح</h2>
        <p>اضغط على الزر بالأسفل لمشاهدة إعلان قصير والحصول على مكافأتك بالدولار.</p>
        <button id="adBtn" onclick="showAd()">تشغيل الإعلان الآن</button>
        <div id="status">جاهز للعرض...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // استلام رمز الأمان المرسل من البوت عبر الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const adToken = tg.initDataUnsafe.start_param || urlParams.get('tgWebAppStartParam') || "";

        function showAd() {
            const btn = document.getElementById('adBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "جاري تشغيل الإعلان...";

            if (typeof show_12230710 === 'function') {
                show_12230710().then(() => {
                    status.innerText = "✅ تمت المشاهدة! جاري توجيهك لاستلام المكافأة...";
                    // إعادة التوجيه إلى البوت مع رمز الأمان لاحتساب الرصيد بأمان
                    const returnUrl = adToken ? `https://t.me/Coin_syria27Bot?start=watched_${adToken}` : `https://t.me/Coin_syria27Bot`;
                    tg.openTelegramLink(returnUrl);
                    setTimeout(() => { tg.close(); }, 800);
                }).catch((e) => {
                    status.innerText = "❌ لم تكتمل المشاهدة أو لا يتوفر إعلان حالياً.";
                    btn.disabled = false;
                });
            } else {
                status.innerText = "⚠️ جاري تحميل مشغل الإعلانات، انتظر 3 ثوانٍ واضغط مجدداً.";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
